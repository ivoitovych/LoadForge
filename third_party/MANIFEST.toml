# Every third-party component, with the facts CI validates: an exact version, an
# immutable source reference, and a licence checked against the GPL-compatible
# allowlist in .github/workflows/licensing.yml.
#
# "vendored" components live under third_party/ and ship in the source tree.
# "fetched" components are acquired at configure time and are test-only.
#
# Nothing is vendored yet, so the runtime dependency count remains zero.

