# SPDX-License-Identifier: GPL-3.0-or-later
name: soak
on:
  # Nightly on main. A soak is hours long by design (T10, docs/PLAN.md §4.6):
  # it finds what a short run cannot -- growth, a lost count, a descriptor kept.
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long the mixed workload soak rotates a worker, in seconds'
        default: '7200'

jobs:
  soak:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build g++-13
      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: The mixed workload, rotated for hours
        # M5 exit criterion 3: no growth of the resident set, descriptors or
        # threads, a tally that never runs backwards, no verification lost.
        env:
          LOADFORGE_SOAK_SECONDS: ${{ inputs.seconds || '7200' }}
        run: ctest --preset debug -R '^MixedSoak\.' --output-on-failure
      - name: The executor and the journal, at their full length
        run: ctest --preset debug -R 'Soak' -E '^MixedSoak\.' --output-on-failure
