# SPDX-License-Identifier: GPL-3.0-or-later
name: sanitizers
on:
  push: { branches: [main] }
  # A pull request that changes only documentation builds nothing these jobs
  # check; licensing.yml still runs on it. Every push to main runs in full.
  pull_request:
    paths-ignore: ['docs/**', 'reviews/**', '**/*.md', '*.md']

# A newer push to the same pull request makes this run's verdict moot; cancel
# it rather than let superseded runs hold the shared runner queue (ci.yml does
# the same).
concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: ${{ matrix.preset }} / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        # TSan is required, not optional: this project is threaded by
        # construction, and a data race here is indistinguishable from the
        # hardware fault the tool claims to have found.
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang-18
      - env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        # The slice runner locks its working set (disagreement 2 of the M2
        # integration), and a runner's default lock allowance is 8 MiB: no
        # sort configuration fits. Lift the allowance for this shell and the
        # tests it starts. The refusal an unprivileged user meets is recorded
        # as that disagreement, for the next contract change to resolve.
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ctest --preset ${{ matrix.preset }}
