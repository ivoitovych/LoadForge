# SPDX-License-Identifier: GPL-3.0-or-later
name: licensing
on:
  push: { branches: [main] }
  pull_request:

jobs:
  spdx:
    name: SPDX headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every source file carries an SPDX identifier
        # The scope is every file the project authors, not only C++ and CMake.
        # The gate used to check .cpp/.hpp/.cmake while calling itself "every
        # source file" -- which left the shell and Python that enforce the whole
        # trust chain, the CMake templates, and the workflows themselves outside
        # a rule they were named by. A licence gate whose stated scope is wider
        # than its real one is worse than a narrow gate honestly described.
        run: |
          missing=0
          while IFS= read -r f; do
            head -3 "$f" | grep -q 'SPDX-License-Identifier: GPL-3.0-or-later' || {
              echo "missing SPDX header: $f"; missing=1; }
          done < <(find src tests cmake tools .github -type f \
                     \( -name '*.cpp' -o -name '*.hpp' -o -name '*.hpp.in' \
                        -o -name '*.cmake' -o -name '*.sh' -o -name '*.py' \
                        -o -name '*.yml' -o -name '*.yaml' -o -name 'CMakeLists.txt' \))
          # CMakePresets.json is deliberately absent: JSON has no comment syntax.
          head -3 CMakeLists.txt | grep -q 'SPDX-License-Identifier: GPL-3.0-or-later' || {
            echo "missing SPDX header: CMakeLists.txt"; missing=1; }
          exit $missing

  action-pins:
    name: Actions are pinned to commit SHAs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No workflow depends on a movable tag
        # Same reasoning as the GoogleTest pin in cmake/Dependencies.cmake: a
        # tag is a movable reference, so "pinned to v4" means the code that runs
        # in CI can change with no change to this repository. Actions run with
        # access to the workflow token, which makes them a more sensitive
        # supply-chain input than a test-only library, not a less sensitive one.
        run: |
          bad=0
          while IFS= read -r ref; do
            grep -qE '^[0-9a-f]{40}$' <<< "${ref##*@}" || {
              echo "unpinned action reference: $ref"
              echo "  pin it to a full commit SHA, with the version in a trailing comment"
              bad=1; }
          done < <(grep -rhoE '^\s*-?\s*uses:\s*\S+' .github/workflows \
                   | sed -E 's/^\s*-?\s*uses:\s*//')
          exit $bad

  dco:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: Every commit is signed off
        # Explicit SHAs, never HEAD. On a pull_request event actions/checkout
        # checks out refs/pull/N/merge -- a synthetic merge of head into base
        # that GitHub authors and does not sign -- so `base..HEAD` walked
        # GitHub's own commit and failed every pull request regardless of
        # sign-off. The logic lives in a script so it can be tested against real
        # repositories, including that merge shape (tests/tools/test_tooling.sh).
        run: >-
          ./tools/check-dco.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  authorship:
    name: One author per commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: No commit carries a second author
        # Stated as a rule about SHAPE, not a list of names.
        #
        # The previous version searched commit metadata for particular vendor
        # identities and phrases. Two things were wrong with that. A denylist
        # only catches the spellings someone thought of, so it is the weaker
        # instrument; and the list itself had to live in this file, which put
        # those names into the repository -- the one place the policy exists to
        # keep them out of.
        #
        # What actually needs enforcing is that every commit has exactly one
        # author and no co-author. That holds for outside contributors too,
        # which a fixed identity would not: contributions are welcome here, and
        # a contributor's own name in their own commit is correct. Their
        # right to submit is covered by the DCO job above.
        run: |
          bad=0
          for c in $(git rev-list -n 100 HEAD); do
            # --parse reads the trailer block properly, so prose that merely
            # mentions the words is not mistaken for an attribution.
            if git log -1 --format='%(trailers:key=Co-authored-by)' "$c" | grep -q .; then
              echo "second author on $(git log -1 --oneline "$c")"
              bad=1
            fi
            for role in an ae cn ce; do
              if [ -z "$(git log -1 --format="%${role}" "$c")" ]; then
                echo "incomplete author or committer identity on $(git log -1 --oneline "$c")"
                bad=1
              fi
            done
          done
          exit $bad

  dependency-licences:
    name: Dependency licences are GPL-compatible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Manifest is complete and every licence is on the allowlist
        # Validates declared licences against an allowlist. The previous version
        # only checked that a directory name appeared in NOTICE, which proved
        # nothing about the licence itself.
        run: python3 tools/check-dependencies.py
      - name: Every external fetch lives in the reviewed dependency module
        # The manifest reconciliation is only as complete as its list of places
        # to look. A FetchContent_Declare added anywhere else would be fetched by
        # the build and seen by nothing.
        run: ./tools/check-fetch-centralization.sh
