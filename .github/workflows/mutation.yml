# SPDX-License-Identifier: GPL-3.0-or-later
name: mutation
on:
  # Weekly on main, with the pinned release below. Not on every pull request:
  # a full mutation run takes far longer than the rest of CI together, and the
  # gate it enforces is about the tests' strength, which changes slowly.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      discover_pin:
        description: 'Bootstrap only: install from upstream and REPORT a candidate pin. Gates nothing.'
        type: boolean
        default: false
      llvm_version:
        description: 'LLVM version Mull is built against (must match the compiler used to build)'
        default: '18'
      mull_deb_url:
        description: 'Override: URL of another Mull .deb (default: the pin below)'
        required: false
      mull_deb_sha256:
        description: 'SHA-256 of that .deb (required with an override URL)'
        required: false

env:
  # The pinned Mull release. Reported by the bootstrap job below from GitHub's
  # runners on 2026-10-20: apt's signed index and the downloaded file agreed on
  # this SHA-256. Trust on first use, as the bootstrap job explains; every run
  # since verifies the download against it and fails on any change.
  MULL_DEB_URL: https://dl.cloudsmith.io/public/mull-project/mull-stable/deb/ubuntu/pool/noble/main/M/Mu/mull-18_0.34.2/Mull-18-0.34.2-LLVM-18.1.3-ubuntu-amd64-24.04.deb
  MULL_DEB_SHA256: e6a1abece45104479ef4afca41438b49bb7214d359aa359eaa3f236f363b33b3

jobs:
  discover:
    # ONE-SHOT BOOTSTRAP, and the only way to establish the first pin.
    #
    # Mull is not in Ubuntu's repositories; it comes from a third-party package
    # host that the development environment cannot reach (403 through its
    # proxy). GitHub's runners can. So this job installs from that host, prints
    # the version and the SHA-256 of what it got, and a human records both in
    # the repository as the pin -- after which every later run verifies against
    # it and any change fails loudly.
    #
    # This is trust-on-first-use, and saying so plainly matters more than the
    # inconvenience of admitting it. Every first pin in this project was TOFU:
    # the GoogleTest commit and the toml++ tree digest were each believed once
    # and verified ever after. What TOFU buys is not proof of the first fetch;
    # it is detection of every subsequent change. That is worth having, and it
    # is strictly more than an unpinned install offers.
    #
    # It does not gate anything and installs nothing the gate then trusts.
    name: bootstrap — report a candidate pin
    if: inputs.discover_pin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install from upstream and report what arrived
        run: |
          set -euo pipefail
          curl -1sLf 'https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh' \
            | sudo -E bash
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update -qq
          # apt-get download saves the .deb in the working directory as the
          # runner user; a find over apt's own cache trips on its root-only
          # partial/ directory and, under pipefail, fails the job.
          apt-get download --print-uris "mull-${{ inputs.llvm_version }}"
          apt-get download "mull-${{ inputs.llvm_version }}"
          deb=$(find . -maxdepth 1 -name "mull-${{ inputs.llvm_version }}_*.deb" | head -n 1)
          [ -n "$deb" ] || { echo "no .deb was downloaded"; exit 1; }
          echo "### Candidate Mull pin" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo "file:    $(basename "$deb")"
            echo "sha256:  $(sha256sum "$deb" | cut -d' ' -f1)"
            echo "size:    $(stat -c%s "$deb") bytes"
            echo '```'
            echo "Record these in the repository, then run this workflow again with"
            echo "\`discover_pin\` unset to use them."
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$deb"

  plan:
    # One shard per module under src/ (tools/mutation-shard.py). The first run
    # over the whole project as one job reached GitHub's six-hour job limit and
    # was cancelled with no report at all (docs/JOURNAL.md §1.26, §2.28): one
    # job per module bounds each, reports each, and lets one module's failure
    # be read as that module's. Derived from the tree on every run, so a new
    # module is swept from its first commit; the plan also fails if any
    # allowlist entry lies in no shard, where nothing would ever review it.
    name: shard plan
    if: '!inputs.discover_pin'
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: plan
        run: |
          set -euo pipefail
          shards="$(./tools/mutation-shard.py plan)"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
      - id: units
        # A unit is a set of sources and the test program that kills mutants in
        # them. A module whose tests are in the shared unit-test program is one
        # unit; a module that owns a test program of its own (verification,
        # telemetry, statistics, the reporters, the results and the journal of
        # the controller, the workloads, ...) is a unit per program, because
        # mull-runner mutates one program, and a mutant that program never runs
        # is a NOT-COVERED mutant, which the gate refuses. Until this step,
        # every shard ran the shared program, so every module with a program of
        # its own was swept by tests that never touched it.
        #
        # Derived from the tree on every run, as the shards are: a fragment
        # (a src/ directory with a CMakeLists.txt, ADR 0004) whose tests
        # fragment names one loadforge_test_suite(loadforge_unit_*_tests) is
        # swept by that program, and the shard of the module around it leaves
        # it out. Header-only contracts (src/telemetry/sample.hpp, ...) have no
        # sources of their own and are swept where they are compiled in.
        run: |
          set -euo pipefail
          units="$(python3 - <<'PY'
          import json, pathlib, re, subprocess, sys

          root = pathlib.Path(".").resolve()
          src = root / "src"
          names_of_shards = json.loads(subprocess.check_output(["./tools/mutation-shard.py", "plan"],
                                                                text=True, stderr=subprocess.DEVNULL))
          shards = {n: subprocess.check_output(["./tools/mutation-shard.py", "scope", n], text=True,
                                               stderr=subprocess.DEVNULL).split() for n in names_of_shards}

          # A fragment is a directory under src/ with a CMakeLists.txt of its own (ADR 0004).
          fragments = sorted(p.parent.relative_to(root).as_posix() for p in src.rglob("CMakeLists.txt")
                             if p.parent != src)

          SUITE = re.compile(r"loadforge_test_suite\(\s*(loadforge_unit_\w+_tests)\b")

          def own_target(fragment):
              cmake = root / "tests" / "unit" / pathlib.Path(fragment).relative_to("src") / "CMakeLists.txt"
              if not cmake.exists():
                  return None
              found = SUITE.findall(cmake.read_text())
              return found[0] if len(found) == 1 else None

          targets = {f: own_target(f) for f in fragments}
          with_tests = [f for f in fragments if targets[f]]

          def below(path, others):
              return [o for o in others if o != path and o.startswith(path + "/")]

          def has_cpp(scope, excludes):
              for cpp in (root / scope).rglob("*.cpp"):
                  rel = cpp.relative_to(root).as_posix()
                  if not any(rel.startswith(e + "/") for e in excludes):
                      return True
              return False

          units = []
          for f in with_tests:
              excl = below(f, with_tests)
              if has_cpp(f, excl):
                  units.append({"name": f.removeprefix("src/").replace("/", "-"), "scopes": [f],
                                "excludes": excl})
          for name, scopes in shards.items():
              excl = [e for s in scopes for e in below(s, with_tests) + ([s] if s in with_tests else [])]
              if any(has_cpp(s, excl) for s in scopes):
                  units.append({"name": name, "scopes": scopes, "excludes": excl})
          names = [u["name"] for u in units]
          assert len(names) == len(set(names)), names
          # Every executable that holds tests of the unit's modules, its own
          # program (a fragment with one) and the shared one among them, not
          # one program per unit: a mutant is killed by whichever detects it,
          # and the gate merges the runs by mutant. A unit no executable tests
          # fails the plan, as it would fail its sweep.
          for u in units:
              args = [a for s in u["scopes"] for a in ("--scope", s)]
              args += [a for e in u["excludes"] for a in ("--exclude", e)]
              u["targets"] = subprocess.check_output(
                  ["./tools/mutation-shard.py", "unit-targets", *args], text=True,
                  stderr=subprocess.DEVNULL).split()
          # Units that need the other architecture's SIMD are not built here.
          import platform
          arch = platform.machine()
          units = [u for u in units
                   if not (u["name"].endswith("-arm") and arch != "aarch64")
                   and not (u["name"].endswith("-x86") and arch != "x86_64")]
          print(json.dumps(units, separators=(",", ":")))
          PY
          )"
          echo "$units" | python3 -m json.tool
          echo "units=$units" >> "$GITHUB_OUTPUT"

  mull:
    # At 100% coverage the coverage number stops carrying information: it can no
    # longer tell a thorough test from one that executes a line and asserts
    # nothing. Mutation testing answers the remaining question -- do the tests
    # detect breakage?
    #
    # GATE: zero unexplained surviving mutants (docs/PLAN.md §7.3). Enforced by
    # tools/mutation-gate.py, which also fails if Mull cannot run: a gate that
    # degrades to a no-op when its tool is missing is a green tick with nothing
    # behind it. Each shard judges itself (--scope): its mutants must all lie in
    # its own module, and it applies, and finds stale, only its own allowlist
    # entries. The verdict job below fails the run if any shard did not pass.
    #
    # The integration step below runs BEFORE the gate is pointed at the project's
    # own tests, and it is the more important of the two. The gate's fixture
    # tests all passed while its parser was reading the mutator as the word
    # "Replaced" -- because the fixtures were written from the same wrong idea of
    # Mull's output as the parser was. Only the real binary can falsify that, so
    # the real binary runs first, against a program with a known-surviving
    # mutant, and the gate is not trusted on this repository until it has. It
    # also proves, on the real Mull, the three things sharding depends on: the
    # test program's arguments reach it, a hung mutant is killed and counted
    # killed, and a report judged under a scope that does not hold it is refused.
    #
    # STATUS: pinned (see env above) and scheduled weekly. A dispatch may name
    # another release, but only together with its own checksum.
    name: zero unexplained surviving mutants (${{ matrix.unit.name }})
    needs: plan
    if: '!inputs.discover_pin'
    runs-on: ubuntu-24.04
    # Each shard is estimated at about ten minutes, most of it installing and
    # building (docs/JOURNAL.md §1.26). An hour is ample, and a shard that
    # needs more has stalled: it fails at an hour instead of holding a runner
    # for six.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    env:
      UNIT: ${{ matrix.unit.name }}
      UNIT_TARGETS: ${{ toJSON(matrix.unit.targets) }}
      UNIT_SCOPES: ${{ toJSON(matrix.unit.scopes) }}
      UNIT_EXCLUDES: ${{ toJSON(matrix.unit.excludes) }}
    steps:
      - name: An overriding URL comes with its own checksum
        # The pin is used unless a dispatch supplies both. A URL alone would be
        # checked against the pinned checksum and fail, which is correct but
        # says less than this does.
        run: |
          if [ -n "${{ inputs.mull_deb_url }}" ] && [ -z "${{ inputs.mull_deb_sha256 }}" ]; then
            echo "mull_deb_url was given without mull_deb_sha256; refusing." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Mull (checksum required)
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang-18 llvm-18 strace
          curl -fsSL --retry 3 "${{ inputs.mull_deb_url || env.MULL_DEB_URL }}" -o /tmp/mull.deb
          echo "${{ inputs.mull_deb_sha256 || env.MULL_DEB_SHA256 }}  /tmp/mull.deb" | sha256sum --check --strict
          sudo dpkg -i /tmp/mull.deb
          mull-runner-18 --version
      - name: This unit's Mull configuration
        # Read twice, through MULL_CONFIG: by the compiler plugin, which then
        # builds in only this unit's mutants, and by mull-runner, which then
        # runs only those. Outside the checkout, so no mull.yml Mull might find
        # by searching upwards from a build directory can stand in for it. The
        # paths are anchored at the checkout and escaped as
        # tools/mutation-shard.py does; what a unit leaves out (the fragments
        # swept by their own programs) is excluded.
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/mull-$UNIT.yml"
          python3 - > "$config" <<'PY'
          import json, os, pathlib
          meta = set("\\.+*?()|[]{}^$#&-~")
          def escape(text):
              return "".join("\\" + c if c in meta else c for c in text)
          base = escape(str(pathlib.Path.cwd()))
          def paths(variable):
              return [f"  - {json.dumps('^' + base + '/' + escape(p) + '/')}"
                      for p in json.loads(os.environ[variable])]
          print("# Generated for the", os.environ["UNIT"], "unit; not a file to edit or commit.")
          print("mutators:")
          print('  - "cxx_default"')
          print("includePaths:")
          print(*paths("UNIT_SCOPES"), sep="\n")
          excludes = paths("UNIT_EXCLUDES")
          if excludes:
              print("excludePaths:")
              print(*excludes, sep="\n")
          PY
          cat "$config"
          echo "MULL_CONFIG=$config" >> "$GITHUB_ENV"
      - env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset debug -DCMAKE_CXX_FLAGS="-fpass-plugin=/usr/lib/mull-ir-frontend-18 -g -grecord-command-line"
      - name: This unit's test executables
        # Every executable that holds a test of the unit's modules, not the one
        # program M1 had (M2a exit criterion 6): a mutant is compiled into each
        # executable that links the code it sits in, and is killed when the
        # tests of any of them detect it (tools/mutation-gate.py merges the
        # runs by mutant). A unit with a test program of its own is swept by it
        # (the units step of the plan, above), and by any other that holds tests
        # of its modules; which those are follows from where the tests live
        # (tools/mutation-shard.py unit-targets, run by the plan).
        run: |
          set -euo pipefail
          targets="$(echo "$UNIT_TARGETS" | python3 -c 'import json,sys; print(*json.load(sys.stdin))')"
          echo "$targets"
          # Word splitting on purpose: one CMake target per word.
          cmake --build --preset debug --target $targets
          binaries=()
          for target in $targets; do
            path="$(find build/debug -type f -perm -u+x -name "$target" | head -n 1)"
            [ -n "$path" ] || { echo "no executable was built for $target" >&2; exit 1; }
            binaries+=("./$path")
          done
          printf '%s\n' "${binaries[@]}" > "$RUNNER_TEMP/binaries-$UNIT.txt"
      - name: The gate agrees with the real Mull
        # Compiles a known-surviving mutant, runs Mull, and checks that the gate
        # parses the exact mutator identifier and that a reviewed key for one
        # operator does not excuse a different operator at the same location.
        # It sets its own MULL_CONFIG.
        run: ./tests/tools/mutation_integration.sh
      - name: The tests every mutant runs create no process
        # Every mutant runs the in-process tests only; the ones that create a
        # process are named RealProcess* and left out, because a child a
        # mutant leaves alive is the one thing Mull's timeout cannot reach
        # (tools/mutation-shard.py). This checks the name against what each
        # test really does, on this binary: the rest create no process, and
        # each RealProcess* test creates one.
        run: |
          set -euo pipefail
          while read -r binary; do
            echo "== $binary"
            ./tools/mutation-shard.py check-processes "$binary"
          done < "$RUNNER_TEMP/binaries-$UNIT.txt"
      - name: Run mutants and enforce the gate
        run: |
          set -euo pipefail
          scope_args=()
          for path in $(echo "$UNIT_SCOPES" | python3 -c 'import json,sys; print(*json.load(sys.stdin))'); do
            scope_args+=(--scope "$path")
          done
          filter="$(./tools/mutation-shard.py gtest-filter)"
          mapfile -t binaries < "$RUNNER_TEMP/binaries-$UNIT.txt"
          ./tools/mutation-gate.py "${binaries[@]}" \
            "${scope_args[@]}" --test-arg="--gtest_filter=$filter" 2>&1 | tee "$RUNNER_TEMP/gate.log"
      - name: Report the verdict
        if: always()
        run: |
          {
            echo "### Mutation unit \`$UNIT\`"
            sed 's/^/- /' "$RUNNER_TEMP/binaries-$UNIT.txt"
            echo '```'
            grep -E '^(mutation gate|  (UNEXPLAINED|STALE|NOT-COVERED|MUTANT OUTSIDE))' \
              "$RUNNER_TEMP/gate.log" || echo "the gate did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-${{ matrix.unit.name }}
          path: build/mutation/
          if-no-files-found: ignore

  verdict:
    # One result for the whole sweep. A matrix job's own result is already
    # failure when any shard fails, but a run whose plan failed would skip every
    # shard, and "skipped" is not "passed": this job fails on anything but
    # every shard succeeding.
    name: every shard passed
    needs: [plan, mull]
    if: always() && !inputs.discover_pin
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "plan: ${{ needs.plan.result }}, shards: ${{ needs.mull.result }}"
          [ "${{ needs.plan.result }}" = success ] && [ "${{ needs.mull.result }}" = success ]
