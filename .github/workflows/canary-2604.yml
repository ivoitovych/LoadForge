name: canary-26.04
on:
  schedule: [{ cron: '0 4 * * 1' }]
  workflow_dispatch:

jobs:
  forward-compat:
    # NON-BLOCKING by design. The reference platform is 24.04 (docs/platforms.md
    # §4); 26.04 brings GCC 15 and glibc 2.43, and its runner images are Public
    # Preview. This job makes the adaptation work visible before it is urgent
    # rather than discovered when someone finally needs a newer distro.
    name: Ubuntu 26.04 forward-compatibility (advisory)
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - name: Test
        # No lock allowance is lifted: the runner's lock policy (M2 contract
        # corrections) lets a process that may not lock its working set run
        # unlocked, and the sweep and every test pass under the 8 MiB default.
        # A failing test's output is printed where it ran, far up a log too long
        # to read whole; the failed tests run once more at the end, so their
        # output is the last thing in the log. The step fails either way.
        run: |
          ctest --preset debug || {
            ctest --preset debug --rerun-failed --output-on-failure
            exit 1
          }
