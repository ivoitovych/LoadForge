# SPDX-License-Identifier: GPL-3.0-or-later
name: coverage
on:
  push: { branches: [main] }
  pull_request:

# A newer push to the same pull request makes this run's verdict moot; cancel
# it rather than let superseded runs hold the shared runner queue (ci.yml does
# the same).
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # On both architectures: each one compiles kernels the other cannot
    # (src/primitives/simd/x86/ and src/primitives/simd/arm/), so each is
    # measured on its own machine, and the completeness check expects each
    # kernel directory only where it is built. Everything else is measured on
    # both, which also holds the rest of src/ to 100% on ARM64.
    name: 100% line and branch / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build g++-13
          # Pinned: a gcovr release can change branch accounting and thereby change
          # what "100% branch coverage" means, with no repository change at all.
          pip install --break-system-packages 'gcovr==8.6'
      - env: { CC: gcc-13, CXX: g++-13 }
        run: cmake --preset coverage
      - run: cmake --build --preset coverage
      - run: find build/coverage -name '*.gcda' -delete
      - name: Test
        # The slice runner locks its working set (disagreement 2 of the M2
        # integration), and a runner's default lock allowance is 8 MiB: no
        # sort configuration fits. Lift the allowance for this shell and the
        # tests it starts. The refusal an unprivileged user meets is recorded
        # as that disagreement, for the next contract change to resolve.
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ctest --preset coverage
      - name: Coverage-gate tooling tests
        # The completeness check decides whether the coverage number describes
        # the whole source tree, so a bug in it silently weakens the gate it
        # guards. Its own failing case is exercised here, before it is trusted
        # below.
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning tools/check-coverage-complete.sh tools/coverage.sh \
                     tests/tools/test_coverage_completeness.sh
      - name: Coverage gate
        run: ./tools/coverage.sh build/coverage
      - name: Coverage-completeness tests
        # Runs after the gate, because the real-report case needs the report the
        # gate just produced -- testing the check against gcovr's actual output
        # rather than against an imitation of it (F21).
        run: ./tests/tools/test_coverage_completeness.sh
      - name: Coverage-exclusion gate
        # docs/PLAN.md §7.3: an exclusion removes a line from the numerator AND
        # the denominator, so it keeps the number at 100% while shrinking what
        # 100% covers. This step used to print the count and stop there, which
        # asked a reviewer to remember last week's number -- not a ratchet.
        # tools/check-exclusions.sh requires every exclusion to carry a written
        # reason and to be listed in tools/coverage-exclusions.txt, and rejects
        # entries that outlive the code they excused.
        run: |
          # pipefail, or 'tee' would swallow the gate's verdict and the step
          # would pass on every failure -- the exact defect being fixed here.
          set -o pipefail
          ./tools/check-exclusions.sh | tee exclusions.txt
          echo "### $(tail -n 1 exclusions.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Test-obligation ledger
        # The coverage gate proves every branch ran. It cannot prove that the
        # paths it does not enumerate -- syscall error modes, capability states,
        # lifecycle transitions -- were considered at all, because their failure
        # arms are invisible to it. This gate proves the judgement was recorded
        # and is current (docs/IMPLEMENTATION.md §2.5).
        run: ./tools/check-test-obligations.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: 'coverage-html-${{ matrix.runner }}', path: build/coverage/coverage.html* }
