name: coverage
on:
  push: { branches: [main] }
  pull_request:

jobs:
  gate:
    name: 100% line and branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build g++-13
          # Pinned: a gcovr release can change branch accounting and thereby change
          # what "100% branch coverage" means, with no repository change at all.
          pip install --break-system-packages 'gcovr==8.6'
      - env: { CC: gcc-13, CXX: g++-13 }
        run: cmake --preset coverage
      - run: cmake --build --preset coverage
      - run: find build/coverage -name '*.gcda' -delete
      - run: ctest --preset coverage
      - name: Coverage gate
        run: ./tools/coverage.sh build/coverage
      - name: Report coverage exclusions
        # docs/PLAN.md §7.3: the exclusion count is reported and may only
        # decrease. A rising count is how a 100% gate rots into decoration.
        run: |
          n=$(grep -rc 'GCOVR_EXCL' src/ 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
          echo "coverage exclusions in src/: $n"
          echo "### Coverage exclusions: $n" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-html, path: build/coverage/coverage.html* }
