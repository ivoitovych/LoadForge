# SPDX-License-Identifier: GPL-3.0-or-later
name: portability
on:
  push: { branches: [main] }
  pull_request:

jobs:
  scalar:
    # Proves no ISA intrinsic has leaked into portable code. Without this the
    # seams rot within months and adding an architecture becomes a rewrite.
    name: scalar-only / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build g++-13
      - env: { CC: gcc-13, CXX: g++-13 }
        run: cmake --preset simd-scalar
      - run: cmake --build --preset simd-scalar
      - run: ctest --preset simd-scalar
      - name: No x86 intrinsics in portable code
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          if grep -rn --include='*.cpp' --include='*.hpp' -E '\b(__m128|__m256|__m512|_mm_|_mm256_|_mm512_)' src/ \
             | grep -v 'src/primitives/simd/x86/'; then
            echo "x86 intrinsics outside src/primitives/simd/x86/" >&2
            exit 1
          fi
      - name: Emit determinism digest
        run: ./build/simd-scalar/loadforge --selftest-digest > digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.runner }}
          path: digest.txt

  cross-arch-determinism:
    # docs/determinism.md: the scalar path must be bit-identical across x86-64
    # and ARM64. Building on both proves nothing on its own -- the outputs have
    # to actually be compared, which is what this job does.
    name: scalar digest identical across architectures
    needs: scalar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: 'digest-*', path: digests }
      - name: Compare
        run: |
          x86=$(cat digests/digest-ubuntu-24.04/digest.txt)
          arm=$(cat digests/digest-ubuntu-24.04-arm/digest.txt)
          echo "x86-64 : $x86"
          echo "ARM64  : $arm"
          if [ "$x86" != "$arm" ]; then
            echo "::error::scalar path is NOT bit-identical across architectures" >&2
            exit 1
          fi
          echo "scalar path is bit-identical across architectures"
          echo "### Cross-arch scalar digest: \`$x86\`" >> "$GITHUB_STEP_SUMMARY"
