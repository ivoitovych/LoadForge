# SPDX-License-Identifier: GPL-3.0-or-later
name: portability
on:
  push: { branches: [main] }
  # A pull request that changes only documentation builds nothing these jobs
  # check; licensing.yml still runs on it. Every push to main runs in full.
  pull_request:
    paths-ignore: ['docs/**', 'reviews/**', '**/*.md', '*.md']

# A newer push to the same pull request makes this run's verdict moot; cancel
# it rather than let superseded runs hold the shared runner queue (ci.yml does
# the same).
concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scalar:
    # Proves no ISA intrinsic has leaked into portable code. Without this the
    # seams rot within months and adding an architecture becomes a rewrite.
    name: scalar-only / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build g++-13
      - env: { CC: gcc-13, CXX: g++-13 }
        run: cmake --preset simd-scalar
      - run: cmake --build --preset simd-scalar
      - name: Test
        # No lock allowance is lifted: the runner's lock policy (M2 contract
        # corrections) lets a process that may not lock its working set run
        # unlocked, and the sweep and every test pass under the 8 MiB default.
        # A failing test's output is printed where it ran, far up a log too long
        # to read whole; the failed tests run once more at the end, so their
        # output is the last thing in the log. The step fails either way.
        run: |
          ctest --preset simd-scalar || {
            ctest --preset simd-scalar --rerun-failed --output-on-failure
            exit 1
          }
      - name: No x86 intrinsics in portable code
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          if grep -rn --include='*.cpp' --include='*.hpp' -E '\b(__m128|__m256|__m512|_mm_|_mm256_|_mm512_)' src/ \
             | grep -v 'src/primitives/simd/x86/'; then
            echo "x86 intrinsics outside src/primitives/simd/x86/" >&2
            exit 1
          fi
      - name: Emit determinism digest
        run: ./build/simd-scalar/loadforge --selftest-digest > digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.runner }}
          path: digest.txt

  cross-arch-determinism:
    # docs/determinism.md: the scalar path must be bit-identical across x86-64
    # and ARM64. Building on both proves nothing on its own -- the outputs have
    # to actually be compared, which is what this job does.
    name: scalar digest identical across architectures
    needs: scalar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: 'digest-*', path: digests }
      - name: Compare
        run: |
          x86=$(cat digests/digest-ubuntu-24.04/digest.txt)
          arm=$(cat digests/digest-ubuntu-24.04-arm/digest.txt)
          echo "x86-64 : $x86"
          echo "ARM64  : $arm"
          if [ "$x86" != "$arm" ]; then
            echo "::error::scalar path is NOT bit-identical across architectures" >&2
            exit 1
          fi
          echo "scalar path is bit-identical across architectures"
          echo "### Cross-arch scalar digest: \`$x86\`" >> "$GITHUB_STEP_SUMMARY"
