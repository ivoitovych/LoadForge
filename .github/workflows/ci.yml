# SPDX-License-Identifier: GPL-3.0-or-later
name: ci
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.runner }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Both architectures are first-class (docs/PLAN.md §4.5). ARM64 matters
        # beyond portability: it is weakly ordered where x86-64 is TSO, so it
        # gives memory-ordering bugs an opportunity to manifest.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build g++-13 clang-18
      - name: Configure
        env:
          CC:  ${{ matrix.compiler == 'gcc' && 'gcc-13' || 'clang-18' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++-18' }}
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug
      - name: The OOM row of the misbehaviour catalogue, as root
        # M1 exit criteria 2 and 3 end to end: a fake worker really OOM-killed
        # under a memory limit and reported kOomKilled. The test makes a memory
        # cgroup and moves itself into it, which the runner user may not do, so
        # under ctest above it skips and says why. As root it can, and the
        # variable turns a skip into a failure; the grep refuses a filter that
        # matched nothing, which GoogleTest would report as a pass.
        run: |
          out=$(sudo env LOADFORGE_REQUIRE_OOM_LIMIT=1 \
            build/debug/tests/supervision/loadforge_supervision_tests \
            --gtest_filter='MisbehaviourCatalogue.AWorkerOomKilledUnderALimitIsOomKilledAndNotAFaultOrAKill' 2>&1) \
            || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          grep -qx '\[  PASSED  \] 1 test\.' <<<"$out"
      - name: The shipped binary links nothing but the C and C++ runtime
        # docs/PLAN.md §5 promised this check "lands at M0" and it did not. It
        # runs on every matrix entry rather than once, because linkage is a
        # property of the toolchain and architecture, not of the source: a
        # dependency that GCC on x86-64 resolves statically may arrive as a
        # NEEDED entry under Clang on ARM64.
        run: ./tools/check-runtime-deps.sh build/debug/loadforge
      - name: The shipped binary carries no test hook
        # The release workflow runs the same gate on the static artifact; here
        # it runs on every compiler and architecture, for the reason the check
        # above does: what a link pulls in is the toolchain's business.
        run: ./tools/check-no-test-hooks.sh build/debug/loadforge

  tooling:
    # The trust chain tests itself: mutation-gate.py decides whether the test
    # suite is good enough, so a bug in it silently weakens every other
    # guarantee. It has had two, and the second one — misreading Mull's mutator
    # identifier — survived a full fixture suite that agreed with it (F21).
    # These tests are necessary and not sufficient; the real binary runs in the
    # mutation workflow.
    name: trust-chain tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install linters and strace
        # Ruff is pinned for the same reason gcovr is: its formatter's output
        # changes between releases, so an unpinned version would make
        # 'ruff format --diff' fail on a tree nobody touched. strace is what
        # tools/mutation-shard.py watches a test program with; its tests here
        # fail rather than skip without it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck strace
          pip install --break-system-packages 'ruff==0.15.8'
      - run: ./tests/tools/test_tooling.sh
      - run: ./tests/tools/test_git_hooks.sh
      - run: ./tests/tools/test_runtime_deps.sh
      - name: ShellCheck
        # The C++ is compiled with -Werror and a long warning list; the shell
        # that decides whether the C++ may ship was, until now, unchecked. An
        # unquoted expansion or a masked exit status in these scripts is a
        # verification failure, not a style complaint.
        run: shellcheck --severity=warning tools/*.sh tools/lib/*.sh tests/tools/*.sh
      - name: Ruff
        # Rule selection and line length live in ruff.toml, so a local run and
        # CI cannot drift apart.
        run: |
          ruff check tools/
          ruff format --diff tools/

  format-and-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang-format-18 clang-tidy-18
      - name: clang-format
        run: find src tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: Configure for compile_commands.json
        # Configure with clang: CompilerWarnings.cmake adds GCC-only flags
        # (-Wduplicated-cond, -Wlogical-op, -Wuseless-cast) under GNU, and
        # clang-tidy would reject them as unknown warning options.
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset debug
      - name: clang-tidy
        # src/ and tests/, minus the tools fixtures (inputs to other programs,
        # not code of the project). tests/.clang-tidy turns off, with reasons,
        # the checks whose premise does not hold in test code. Two directories
        # under tests/ are held to the product's bar instead, by a .clang-tidy
        # that links to the root one: the fake worker, a second implementation
        # of the worker contract, and tests/contracts/headers, one unit per
        # contract header, so a header no src/ file includes yet is tidied now
        # (ADR 0004).
        run: find src tests -name '*.cpp' -not -path 'tests/tools/fixtures/*' | xargs clang-tidy-18 -p build/debug
