# SPDX-License-Identifier: GPL-3.0-or-later
name: ci
on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.runner }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Both architectures are first-class (docs/PLAN.md §4.5). ARM64 matters
        # beyond portability: it is weakly ordered where x86-64 is TSO, so it
        # gives memory-ordering bugs an opportunity to manifest.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build g++-13 clang-18
      - name: Configure
        env:
          CC:  ${{ matrix.compiler == 'gcc' && 'gcc-13' || 'clang-18' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++-18' }}
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  tooling:
    # The trust chain tests itself: mutation-gate.sh decides whether the test
    # suite is good enough, so a bug in it silently weakens every other
    # guarantee. It had exactly such a bug.
    name: trust-chain tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/tools/test_tooling.sh

  format-and-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang-format-18 clang-tidy-18
      - name: clang-format
        run: find src tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: Configure for compile_commands.json
        # Configure with clang: CompilerWarnings.cmake adds GCC-only flags
        # (-Wduplicated-cond, -Wlogical-op, -Wuseless-cast) under GNU, and
        # clang-tidy would reject them as unknown warning options.
        env: { CC: clang-18, CXX: clang++-18 }
        run: cmake --preset debug
      - name: clang-tidy
        run: find src -name '*.cpp' | xargs clang-tidy-18 -p build/debug
