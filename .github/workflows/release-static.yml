# SPDX-License-Identifier: GPL-3.0-or-later
name: release-static
on:
  push: { branches: [main] }
  pull_request:

# A newer push to the same pull request makes this run's verdict moot; cancel
# it rather than let superseded runs hold the shared runner queue (ci.yml does
# the same).
concurrency:
  group: release-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    # F19: the static artifact is what makes LoadForge usable from live and
    # rescue media, where the userspace ABI is whatever the medium carries.
    # Built on every change so it cannot rot.
    name: static artifact / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build g++-13
      - env: { CC: gcc-13, CXX: g++-13 }
        run: cmake --preset static
      - run: cmake --build --preset static
      - name: The contract headers compile under the artifact's flags
        # A header function inlined into a consumer can fail at -O3 where the
        # header alone does not (journal fragment 02, question 9); the units in
        # tests/contracts/headers/ use such functions, and this builds them
        # with the static artifact's optimisation level.
        env: { CC: gcc-13, CXX: g++-13 }
        run: cmake --preset static-headers && cmake --build --preset static-headers
      - name: Verify it is genuinely static and runs
        run: |
          bin=build/static/loadforge
          file "$bin"
          if ldd "$bin" 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "binary is dynamically linked" >&2; ldd "$bin"; exit 1
          fi
          "$bin" --version
      - name: No test-hook symbol in the shipped binary
        # docs/IMPLEMENTATION.md §4 (M1): the misbehaving worker the controller
        # is tested against is a separate test-only executable, and this reads
        # the artifact that ships to prove none of it, nor any test fake or
        # test framework, ended up inside. Before upload, and on the symbols
        # as built: a stripped binary would be refused, not waved through.
        run: ./tools/check-no-test-hooks.sh build/static/loadforge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loadforge-static-${{ matrix.runner }}
          path: build/static/loadforge
