# SPDX-License-Identifier: GPL-3.0-or-later
#
# The per-module test-obligation ledger. Enforced by
# tools/check-test-obligations.py; the doctrine is docs/IMPLEMENTATION.md §2.
#
# WHY THIS FILE EXISTS
#
# The project gates 100% line and branch coverage, and that gate cannot see most
# of what needs testing. An EACCES from open(), a short read, an EINTR, a
# counter that wraps mid-sample: none of these is a branch gcov reports as
# uncovered, because the success case covers the branch and the failure arm
# simply never runs. Coverage says 100% and means it.
#
# So IMPLEMENTATION.md §2.2 classifies execution paths into seven kinds, and only
# the first is enumerated by a tool:
#
#   P1  decision      each branch outcome, each switch arm, loops at 0/1/many
#   P2  error         each documented failure of each fallible call
#   P3  boundary      empty, one, max, overflow, negative, subnormal, NaN, wrap
#   P4  verification  pass, each corruption classification, and not-performed
#   P5  concurrency   the orderings the design depends on
#   P6  lifecycle     startup, each abnormal termination, restart, teardown
#   P7  capability    per source: present, absent, EACCES, malformed, vanishes, wraps
#
# Enumerating P2 through P7 is human judgement, so it must leave a trace or it
# will be skipped under deadline. Declaring a module's classes here does not
# prove the enumeration is complete -- nothing can. It proves the enumeration was
# MADE, is CURRENT, and that the tests it promises exist. That is the difference
# between a convention and a gate, and this project has learned which one
# survives contact with a deadline.
#
# T0 (static), T0b (gate tests) and T9 (sanitizers) are never listed: they are
# universal. A blank 'tiers' is therefore a real exemption, never an oversight.
#
# PROCESS-SHARED LOCKS, ONE ENTRY EACH
#
# docs/PLAN.md §4.6: a worker can die holding a process-shared lock, and unless
# the lock is robust and every acquirer handles EOWNERDEAD, one dead worker
# deadlocks every survivor. So every such lock is declared in its module's row,
# with the supervision test that kills its holder mid-critical-section and
# proves a survivor recovers:
#
#   process_shared_locks = [
#     { name = "...", file = "src/<module>/<file>", robustness_test = "tests/supervision/<file>" },
#   ]
#
# The gate finds the primitives in src/ by name (PTHREAD_PROCESS_SHARED,
# pthread_mutexattr_setrobust, sem_init, futexes and the like) and refuses a file
# that uses one without a declaration; the test must carry the line
# "LOADFORGE EOWNERDEAD TEST: <name>", and the module must declare P5.
#
# There are none today, by design: the one piece of state workers and the
# controller share is the heartbeat region, single-writer seqlock slots with no
# lock to die holding (docs/JOURNAL.md §2.15). The gate says so on every run.

[[module]]
path    = "src/core"
classes = ["P1", "P3"]
tiers   = ["T1"]
note    = "Pure value logic: Result, ParseError, duration and byte-size parsing, and CRC-32 pinned to the published check value. No syscalls, so no P2."

[[module]]
path    = "src/config"
classes = ["P1", "P3"]
tiers   = ["T1", "T8"]
note    = """
TOML parse, schema validation and memory resolution. P3 is the substance: every \
value has a stated domain and every boundary a test (a zero duration, zero \
threads, a temperature past 150, a share past 100%). A failing open in load() \
is P2-shaped but is not behind the seam -- docs/PLAN.md §4.2 keeps config reading \
as ordinary file I/O -- so it is reached by a real missing path and a real \
directory in T8 and by the built binary through --check-config, and the row \
declares P1 and P3 rather than claiming a T2 it does not have."""

[[module]]
path    = "src/worker/ipc"
classes = ["P1", "P2", "P3", "P4", "P5"]
tiers   = ["T1", "T2"]
note    = """
The heartbeat region: a memfd of single-writer seqlock slots, no lock anywhere \
(PLAN §4.6 prefers a design with nothing to recover over one that recovers). P2 \
is every failure of memfd_create, ftruncate, mmap and fcntl, forced through the \
fake. P5 is the seqlock protocol itself: the ordering tests carry the written \
synchronisation argument and run under TSan, and a writer that dies mid-update \
is modelled as an odd sequence that readers report as torn rather than wait on. \
Real-kernel corroboration of the three seam calls -- close-on-exec set, cleared \
on request, a child seeing the parent's writes through its own mapping -- is in \
tests/unit/platform/real_syscalls_test.cpp. \
\
The record channel brings P3 and P4. P3: the empty payload, the largest payload, \
and one byte more; every prefix of a frame yields nothing and the last byte \
completes it. P4 is what the channel is FOR: a frame is verified by a checksum \
over its header and payload, and each corruption has its own classification -- \
bad magic, bad version, oversized, bad checksum, truncated -- with found and \
expected in the detail. The reader never resynchronises past a fault, because a \
reader that skipped ahead would turn one corrupt byte into a quietly shorter \
stream of findings. The exhaustive test corrupts every byte of a multi-frame \
stream in turn, under random chunking, and requires a fault at or before the \
corrupted frame with every earlier frame delivered intact and no record ever \
delivered that was not sent. P2 here is write, read, pipe2 and poll: short \
writes, EINTR to the bound, EPIPE, EBADF, EAGAIN, a write that transfers \
nothing. The pipe is driven against the kernel too -- a forked child sends \
three records, one of them larger than the pipe buffer, and the parent polls \
and drains to the end -- and the seam's own answers (POLLHUP with bytes still \
queued, POLLNVAL for a closed number, a negative number ignored, EPIPE, EINVAL \
past RLIMIT_NOFILE, EMFILE) are in real_syscalls_test.cpp. \
\
No process-shared lock: the region is the design PLAN 4.6 prefers to one that \
recovers, and the lock-obligation gate checks on every run that src/ holds \
none undeclared. The library is linked by the real worker and, without the \
real worker's loop, by the test-only fake worker (ADR 0003)."""

[[module]]
path    = "src/worker"
classes = ["P1", "P2", "P3", "P6"]
tiers   = ["T1", "T2", "T8"]
note    = """
The worker process itself: the internal switch's argument parser, the null \
workload loop, and the entry point from attach to exit code. P6 is the point: \
this is the worker's lifecycle from the inside -- attach, report started, run, \
and the four ways out (complete, setup failed, controller lost, bad arguments), \
each its own exit code chosen not to collide with the launcher's 120-123 (a \
static_assert says so). Every way out is forced through the fake (T2): a signal \
that cannot be ignored, a descriptor that is not a region, a record pipe with \
no reader, a CPU no mask can name, a cpuset that withholds the CPU asked for, a \
poll that fails, a finished record that cannot be sent. P3 is the argument \
parser: every key required once, every value with a stated domain and its \
boundary refused by name, and the argv the controller builds parses back to \
the same arguments. The loop's own P6 -- stop on time, stop on request, leave \
on hang-up, staleness, or a controller that died mid-publish -- is driven by a \
clock that advances per read, so a run of several ticks happens inside one \
call. T8: the real binary refuses a misused switch with the bad-arguments code \
and names the argument; and the CLI tests run a real worker in-process, over \
the real seam, against a memfd region and two pipes the test holds as the \
controller. The worker under a real controller is the supervision tier's \
(T7), which lands with the controller."""

[[module]]
path    = "src/controller"
classes = ["P1", "P2", "P3", "P6"]
tiers   = ["T1", "T2", "T7"]
note    = """
The supervisor. P6 is its whole subject: the topology snapshot the stress \
command takes before the run and the plan carries before the first fork \
(START to RUNNING; refused by the command when /sys will not describe the \
machine), spawn, the controller's own beat before the first fork, the deadline's stop request, the escalation ladder \
(request, SIGTERM, SIGKILL, each after its grace), reap, drain, classify. \
The classification table (supervision) is pure and tested row by row against \
the misbehaviour catalogue of IMPLEMENTATION 4, including the pairs that must \
never be confused: a fault from a kill, a kill the controller sent from one \
it did not, a stop at the deadline from a timeout, a clean exit with its \
finished record from one without. The ladder (safety) is a function of time \
and tested as one. P2 is forced through the fake over the whole loop: the \
region, the pipes (either pipe of a worker), the fork, the close of the \
child's ends, the clock at every read, poll, the drain, the signal, the reap, \
the control write, the release. T7 is tests/supervision: the shipped binary \
as the worker, N >= 2 in every case -- two complete for the duration, one is \
killed from outside while the other completes, and the controller itself is \
killed and every orphan is reaped by the test as subreaper and found dead by \
the parent-death signal within a bounded time; and a real snapshot of this \
machine's /sys is in the plan before the spawn of two real workers, its CPU \
count checked against sysconf. \
\
The misbehaviour catalogue of IMPLEMENTATION 4 is tests/supervision/catalogue_test.cpp: \
the controller runs tests/support/fake_worker, a second implementation of the \
worker contract that misbehaves on demand, and every reachable row is a test \
with N >= 2 -- exit 0 with no zombie, exit non-zero, SIGSEGV, SIGBUS and SIGABRT \
with the timeline kept, a silent hang holding its descriptors, a spin beside a \
slow worker that completes, a record pipe closed early, a truncated record, a \
bad checksum, a stop byte written to a control pipe nobody reads (EPIPE, \
never death by SIGPIPE: the row "exit just before the deadline stop" without \
its race), SIGTERM ignored and SIGKILL one grace later, and (N = 3) \
grandchildren left spinning, which the controller now kills with their worker's \
process group as it reaps the worker. A worker deaf to its control pipe is \
ended by the parent-death signal alone when the controller is killed: the one \
test of that signal no hang-up can pass for. OOM is \
below; the process-shared lock row has no lock to test (see the header). \
\
OOM is told from a fault and from a plain kill by the kernel's own record: \
a SIGKILL the controller did not send is kOomKilled only when the workers' \
cgroup's OOM-kill count, read before the first fork and after the last reap, \
rose by at least as many as there are such deaths; otherwise every one stays \
kKilled and its report says why. The table row, the candidate rule and the \
judgement (every outcome: enough, none, too few, a count that went back, \
unreadable at either end) are pure and tested row by row; the loop is driven \
against the controller's own fake of the record's contract \
(resources/oom_kill_record.hpp), never the reader's tests (docs/adr/0003). \
End to end, T7 in catalogue_test.cpp: three fake workers in a memory \
cgroup the test makes and moves itself into, limited to 256 MiB, so the \
workers are born there and the record the controller opens before the first \
fork reads that cgroup's count; one allocates until the kernel's OOM killer \
ends it (kOomKilled, the count moved by one), one dies by SIGSEGV beside it \
(kFault), one completes. It skips, quoting the kernel's refusal, where no \
such cgroup can be made (cgroup v2 without delegation and not root). Its \
companion runs wherever a count can be read: a SIGKILL from outside, the \
same record consulted, stays kKilled and says the count did not move. The \
kernel's side alone -- a child really OOM-killed moves its cgroup's count by \
one, and a kill -9 moves it by none -- is the reader's T8, in \
tests/unit/resources."""

[[module]]
path             = "src/resources"
classes          = ["P1", "P2", "P3", "P7"]
tiers            = ["T1", "T2", "T8"]
fixture_builders = [
  "tests/unit/resources/cgroup_test.cpp",
  "tests/unit/resources/memory_budget_test.cpp",
  "tests/unit/resources/cgroup_oom_record_test.cpp",
]
note             = """
What the kernel lets this process use and what it records when that runs \
out: MemAvailable from /proc/meminfo, the memory cgroup's limit under v1 \
(memory.stat's hierarchical_memory_limit, the kernel's own effective figure) \
and v2 (the lowest memory.max from the cgroup up to its mount), found through \
/proc/self/cgroup AND /proc/self/mountinfo -- the second because a v1 \
container without a cgroup namespace is mounted at its own cgroup, and a \
reader that joined the two paths would find nothing and call it no limit -- \
and the cgroup's OOM-kill count (memory.events, memory.oom_control). \
\
P7 is the module's subject: every source -- meminfo, the membership, \
mountinfo, the directory probe, each limit file, the count -- is put in each \
state it can be in, present, absent, denied, malformed, unreadable, and for \
the count, which is read more than once, vanished. Absent is a reading in \
exactly three places (no cgroups at all, no memory cgroup, a v2 level with \
no memory.max) and a failure everywhere else, because "could not read the \
limit" must never become "no limit". The trees are BUILT per test and read \
through RealSyscalls; denial is aimed at one source at a time through \
FakeSyscalls' read script (P2, T2), since the tests run as root and a \
mode-000 file arrives from a clone readable; vanished is made by reading the \
count and removing it. \
\
P3: the v1 unlimited sentinel on every page size and the floor below it, \
the largest limit a page counter holds and one past it, the largest kB count \
a byte count can carry and one past it, every escape mountinfo writes and \
the ones it does not, a mount root that prefixes a path as text but not as \
a path. \
\
T8 reads the real machine and checks it against the kernel's other figures: \
the located cgroup's cgroup.procs lists the test's pid; MemAvailable is no \
more than sysconf's physical memory; on v1 the hierarchical limit is no \
higher than any visible level's own; the count does not move for a real \
kill -9; and where a v1 memory cgroup can be made (root, v1 or hybrid), a \
child really OOM-killed under a 16 MiB limit dies of SIGKILL and moves its \
cgroup's count by exactly one. On a v2 host that last test skips and says \
why: a leaf that holds processes cannot be given a memory-limited child. \
The binary's own run with memory configured must say the limit is enforced \
(cli_stress_enforces_memory), so a reader that refused a real machine fails \
there and not only in the field.\
"""

[[module]]
path    = "src/reporters"
classes = ["P1"]
tiers   = ["T1"]
note    = "The console voice: banner, timed event lines, summary. Pure formatting, compared line for line."

[[module]]
path    = "src/main"
classes = ["P1", "P3"]
tiers   = ["T1", "T8"]
note    = "CLI dispatch and the selftest digest. T8 runs the real binary, so main() is covered rather than excluded."

[[module]]
path             = "src/platform"
classes          = ["P1", "P2", "P3", "P6", "P7"]
tiers            = ["T1", "T2", "T8"]
fixture_builders = ["tests/unit/platform/affinity_test.cpp", "tests/unit/platform/memory_test.cpp"]
note             = """
The seam. P2 is the reason this module exists: every errno of open(2), read(2) \
and close(2) is forced through a substitutable Syscalls, because none of those \
failure arms is a branch a coverage tool can see as uncovered. T2 is where the \
forcing happens (tests/support/fake_syscalls.hpp); T8 drives the same code \
against a real kernel in a temporary directory, because a fake agrees with \
whatever the code believes (F21) -- that test is what established that \
open(dir, O_RDONLY) succeeds and EISDIR comes from read(2) instead. \
\
ExitStatus classifies waitpid(2) status words and is pure decision and boundary \
logic (P1, P3), so it needs no seam -- but the same F21 rule applies to its \
CONSTANTS: the encodings its unit tests use were read off real children forked \
and killed by the RealWaitStatus tests, not recalled, and it was those that \
established the W* macros do not partition the integers. \
\
WorkerLauncher is where P6 arrives, because it is the first code that PERFORMS \
a lifecycle transition rather than describing one: fork, arm the death signal, \
exec, and the three ways a worker can fail before it does any work. Two of \
those are unreachable against a real kernel and exist only because the seam \
does -- a fork that fails needs RLIMIT_NPROC, which is not enforced for the \
privileged process CI runs as, and the PR_SET_PDEATHSIG race needs the \
supervisor to die inside a window of a few instructions. Once past the race \
check the child starts a session of its own (setsid), so that whatever a \
worker forks stays in a group the controller can kill after the worker is \
reaped: the death signal is cleared across fork and cannot. start_session has \
no failure arm, because the child of a fork never leads a group and so cannot \
be refused; its line runs in the test process, where setsid is made to be \
refused, and a real child shows it leads its own session and group. \
\
WorkerPool adds the supervisor's half: spawning N, reaping them, telling one \
worker's death from another's. Every test there runs N >= 2, because with one \
worker "noticed a death" and "noticed the only child exited" are the same \
observation and a pool that ignored pids entirely would pass. Its hardest paths \
are the unwind of a partial spawn -- forks 1 and 2 succeeded, fork 3 failed, and \
the survivors must be signalled and reaped before the error is reported -- and \
a reaped child that is NOT ours, which must be skipped rather than attributed to \
a worker. \
\
Two decisions moved ABOVE the seam for the same reason: fork's and waitpid's \
errno translation live in result_or_error, because leaving them in RealSyscalls \
would have made their failing arms permanently unreachable and demanded the \
project's first coverage exclusion. That template is instantiated per type, so \
each instantiation carries its own coverage and each is exercised. \
\
Affinity brings the module's first P7, and the state is not a file: it is a \
cpuset that permits fewer CPUs than the topology found. That cannot be \
committed and cannot be arranged in CI, which runs as root in whatever cpuset \
the runner gives it, so it is BUILT in FakeSyscalls, which models \
sched_setaffinity the way the kernel behaves -- the mask is intersected with \
what is permitted and refused with EINVAL when nothing is left. A fake that \
accepted any mask would be laxer than the kernel and prove nothing about the \
one case that matters. The real kernel's answers (EINVAL for an empty or \
unknown mask, ESRCH for a vanished thread) are asserted against the calling \
process ONLY: as root, sched_setaffinity moves any pid, and a probe that \
pinned init proved it. The telemetry sources' P7 still arrives at M3.\
"""

[[module]]
path             = "src/topology"
classes          = ["P1", "P2", "P3", "P7"]
tiers            = ["T1", "T2", "T8"]
fixture_builders = [
  "tests/unit/topology/source_test.cpp",
  "tests/unit/topology/cpu_topology_test.cpp",
  "tests/unit/topology/cache_test.cpp",
  "tests/unit/topology/numa_test.cpp",
  "tests/unit/topology/snapshot_test.cpp",
]
note             = """
The sysfs CPU-list parser, and the Source that decides what a failed reading \
MEANS. \
\
P2 arrived with Source::classify. The parser had none -- pure text logic, with \
the errno paths belonging to the FileSystem that handed it a line -- but \
classify is this module's own per-errno decision, and getting it wrong is not a \
crash, it is a confident wrong statement about the user's hardware. Those arms \
are forced through the seam (T2), because the one that matters most cannot be \
provoked otherwise: the tests run as root, and root bypasses the DAC check that \
produces EACCES, so a chmod-000 file would be read successfully and the test \
would pass having proved nothing. \
\
P7 is the class this module exists for: a source present, absent, denied, \
malformed, unreadable, or VANISHED -- present once and gone now. The last is \
the one no stateless classifier can produce, since ENOENT is ENOENT and only a \
reader that remembers succeeding can tell "this kernel never offered it" from \
"the machine changed under us". Reporting the second as the first would attach \
every number gathered before the change to a machine that no longer exists. \
\
The fixtures are BUILT, not committed, and the ledger names the builder \
instead. Neither state that matters can survive a checkout: vanishing mid-run \
is an event rather than a tree, and a mode-000 file arrives readable because \
git stores the execute bit and nothing else. A committed fixture for either \
would pass while demonstrating the opposite of its claim. \
\
P3 is where the weight is, because every boundary here is a place a wrong \
answer would look right: an empty value is a LEGITIMATE reading (offline is \
empty on a healthy machine) rather than an error; a descending range, a \
duplicate id and overlapping elements are all refused because \
cpumask_print_to_pagebuf cannot emit them, so a file containing one is not the \
file we think; and the id bound is checked inside the digit loop, because a \
long enough run of digits wraps a 64-bit accumulator and lands back on a small, \
entirely plausible CPU id. \
\
T8 parses the real files this kernel writes -- online, offline, both sibling \
lists for every online CPU, and every cache level's sharing list -- and checks \
the count against sysconf(_SC_NPROCESSORS_ONLN), an independent source, so the \
agreement is evidence rather than a tautology (F21). It now also reads a \
sysfs path this kernel does not offer, unlinks a file between two readings, and \
points a Source at a directory and at a path whose parent is a file -- real \
ENOENT, real EISDIR, real ENOTDIR, none of them faked. \
\
CpuTopology adds the reason this module has cross-checks at all. The kernel \
publishes the same facts several times over -- online from the hotplug \
machinery, thread_siblings_list from the scheduler's masks, core_id and \
physical_package_id from the architecture's CPU identification -- and nothing \
outside the kernel makes them agree. Discovery REFUSES when they do not, \
because a wrong core count is not a visible failure: it is a number every \
later report is attributed against, and nothing downstream would question it. \
\
Its tests BUILD a sysfs tree and drive RealSyscalls at it. A fake would agree \
with whatever this code believes, which is worthless for testing disagreement \
(F21); a committed tree would put each hostile arrangement in a directory of \
near-identical trees instead of beside the assertion it exists for. The real \
/sys is read as well, because a tree these tests wrote is still a tree these \
tests believe in -- and if any cross-check were too strict for real hardware, \
that is the test that says so. \
\
CacheHierarchy reads the same fact several times over -- sysfs publishes a \
shared cache once per CPU that can see it -- and that repetition is what makes \
it checkable: every CPU sharing a cache must describe it identically, and \
sharing must only widen with level. Two plausible checks are deliberately \
absent because they are false of real machines (big.LITTLE gives cores \
different cache depths; L1i and L1d differ in size at the same level), and a \
check that refuses real hardware is worse than none -- a rule the first \
version broke by REQUIRING cache/indexN/id, which arm64 kernels do not \
publish; CI's arm64 job refused it, so identity is now (level, type, \
shared_cpu_list) and id, size and line are optional readings. Absent is the \
only thing an optional attribute may be short of a value: a denied or \
unreadable one still fails, and a test makes each a directory to prove it. \
\
NumaTopology completes discovery. Its certain checks: node CPU lists \
partition `online` (cpu_to_node is a function), a distance row has one entry \
per online node, and a node's meminfo names that node on every line. Its \
deliberate omissions matter more: node memory does NOT sum to the machine's \
-- on the VM this was written against node0 reported 4962 MiB against a \
16095 MiB system with every memory block under node0 -- so nothing compares \
them and there is no total to misuse. A kernel publishing no node directory \
is reported as a layout with no nodes, not refused and not given an invented \
single node. meminfo is the first multi-line source, read through the new \
Source::lines(); the MemTotal parsing stays in numa.cpp until /proc/meminfo \
at M3 gives it a second caller. Its size parser is its \
own rather than core::parse_byte_size, which rejects the bare K sysfs writes \
and accepts the percentages a cache size must never; a test pins that boundary \
in both directions so nobody unifies them. \
\
The Snapshot takes the three together, once, for the controller to hold \
before it forks (PLAN 4.1): whole or not taken, the first half to refuse is \
the answer, and a layout the kernel does not publish is described as not \
exposed, never as zero.\
"""
