# SPDX-License-Identifier: GPL-3.0-or-later
#
# The per-module test-obligation ledger. Enforced by
# tools/check-test-obligations.py; the doctrine is docs/IMPLEMENTATION.md §2.
#
# WHY THIS FILE EXISTS
#
# The project gates 100% line and branch coverage, and that gate cannot see most
# of what needs testing. An EACCES from open(), a short read, an EINTR, a
# counter that wraps mid-sample: none of these is a branch gcov reports as
# uncovered, because the success case covers the branch and the failure arm
# simply never runs. Coverage says 100% and means it.
#
# So IMPLEMENTATION.md §2.2 classifies execution paths into seven kinds, and only
# the first is enumerated by a tool:
#
#   P1  decision      each branch outcome, each switch arm, loops at 0/1/many
#   P2  error         each documented failure of each fallible call
#   P3  boundary      empty, one, max, overflow, negative, subnormal, NaN, wrap
#   P4  verification  pass, each corruption classification, and not-performed
#   P5  concurrency   the orderings the design depends on
#   P6  lifecycle     startup, each abnormal termination, restart, teardown
#   P7  capability    per source: present, absent, EACCES, malformed, vanishes, wraps
#
# Enumerating P2 through P7 is human judgement, so it must leave a trace or it
# will be skipped under deadline. Declaring a module's classes here does not
# prove the enumeration is complete -- nothing can. It proves the enumeration was
# MADE, is CURRENT, and that the tests it promises exist. That is the difference
# between a convention and a gate, and this project has learned which one
# survives contact with a deadline.
#
# T0 (static), T0b (gate tests) and T9 (sanitizers) are never listed: they are
# universal. A blank 'tiers' is therefore a real exemption, never an oversight.

[[module]]
path    = "src/core"
classes = ["P1", "P3"]
tiers   = ["T1"]
note    = "Pure value logic: Result, ParseError, duration and byte-size parsing. No syscalls, so no P2."

[[module]]
path    = "src/main"
classes = ["P1", "P3"]
tiers   = ["T1", "T8"]
note    = "CLI dispatch and the selftest digest. T8 runs the real binary, so main() is covered rather than excluded."

[[module]]
path    = "src/platform"
classes = ["P1", "P2", "P3", "P6"]
tiers   = ["T1", "T2", "T8"]
note    = """
The seam. P2 is the reason this module exists: every errno of open(2), read(2) \
and close(2) is forced through a substitutable Syscalls, because none of those \
failure arms is a branch a coverage tool can see as uncovered. T2 is where the \
forcing happens (tests/support/fake_syscalls.hpp); T8 drives the same code \
against a real kernel in a temporary directory, because a fake agrees with \
whatever the code believes (F21) -- that test is what established that \
open(dir, O_RDONLY) succeeds and EISDIR comes from read(2) instead. \
\
ExitStatus classifies waitpid(2) status words and is pure decision and boundary \
logic (P1, P3), so it needs no seam -- but the same F21 rule applies to its \
CONSTANTS: the encodings its unit tests use were read off real children forked \
and killed by the RealWaitStatus tests, not recalled, and it was those that \
established the W* macros do not partition the integers. \
\
WorkerLauncher is where P6 arrives, because it is the first code that PERFORMS \
a lifecycle transition rather than describing one: fork, arm the death signal, \
exec, and the three ways a worker can fail before it does any work. Two of \
those are unreachable against a real kernel and exist only because the seam \
does -- a fork that fails needs RLIMIT_NPROC, which is not enforced for the \
privileged process CI runs as, and the PR_SET_PDEATHSIG race needs the \
supervisor to die inside a window of a few instructions. \
\
WorkerPool adds the supervisor's half: spawning N, reaping them, telling one \
worker's death from another's. Every test there runs N >= 2, because with one \
worker "noticed a death" and "noticed the only child exited" are the same \
observation and a pool that ignored pids entirely would pass. Its hardest paths \
are the unwind of a partial spawn -- forks 1 and 2 succeeded, fork 3 failed, and \
the survivors must be signalled and reaped before the error is reported -- and \
a reaped child that is NOT ours, which must be skipped rather than attributed to \
a worker. \
\
Two decisions moved ABOVE the seam for the same reason: fork's and waitpid's \
errno translation live in result_or_error, because leaving them in RealSyscalls \
would have made their failing arms permanently unreachable and demanded the \
project's first coverage exclusion. That template is instantiated per type, so \
each instantiation carries its own coverage and each is exercised. \
\
No P7 yet: capability states arrive with the telemetry sources at M3.\
"""
