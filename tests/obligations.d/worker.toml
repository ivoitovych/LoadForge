# Ledger fragment (ADR 0004): this file declares src/worker and nothing else.

[[module]]
path    = "src/worker"
classes = ["P1", "P2", "P3", "P4", "P6"]
tiers   = ["T1", "T2", "T7", "T8"]
consumes = ["SliceRunnerContract", "RecordCodecContract"]
note    = """
From M2a a worker runs a real workload: the null workload's loop with the work \
inside it. P4: it is what a verification result leaves the machine through, so \
it sends every record the runner made and the running tally on the record \
channel, a record it cannot send because the channel has no reader is the \
controller gone (EPIPE) and anything else is its own failure, and the final \
report that states what the whole run did not check goes out before the \
worker says it finished. The runner and the record codec it consumes are run \
against the worker's own models of them (model_runner.hpp, model_codec.hpp): \
the providers' suites, not the providers' tests. Start-up is ordered and each \
step has its own refusal: registers established before any thread and asserted \
again after everything that could have loaded a library (a change is reported, \
not repaired), the ISA path the controller chose used or refused and never \
replaced, the workload, its oracle for the plan it resolved, the executor, the \
runner. The re-run entry point (--rerun) runs one unit on one CPU with every \
check on and answers by exit code (clean, reproduced, not performed, bad \
arguments), and a version mismatch, a check that could not be made and a \
signal are never a clean re-run. The tally frame (type 17) is cumulative. \
\
The worker process itself, as M1 shipped it: the internal switch's argument parser, the null \
workload loop, and the entry point from attach to exit code. P6 is the point: \
this is the worker's lifecycle from the inside -- attach, report started, run, \
and the four ways out (complete, setup failed, controller lost, bad arguments), \
each its own exit code chosen not to collide with the launcher's 120-123 (a \
static_assert says so). Every way out is forced through the fake (T2): a signal \
that cannot be ignored, a descriptor that is not a region, a started or \
finished record the channel refuses (setup failed), a record pipe with no \
reader at either record (controller lost: EPIPE says the reader is gone), a \
CPU no mask can name, a cpuset that withholds the CPU asked for, a poll that \
fails. P3 is the argument \
parser: every key required once, every value with a stated domain and its \
boundary refused by name, and the argv the controller builds parses back to \
the same arguments. The loop's own P6 -- stop on time, stop on request, leave \
on hang-up, staleness, or a controller that died mid-publish -- is driven by a \
clock that advances per read, so a run of several ticks happens inside one \
call. T8: the real binary refuses a misused switch with the bad-arguments code \
and names the argument; and the CLI tests run a real worker in-process, over \
the real seam, against a memfd region and two pipes the test holds as the \
controller. The worker under a real controller is the supervision tier's \
(T7), which lands with the controller. \
\
Since M5 the worker also obeys worker/control.hpp: the control pipe carries \
framed messages (type 32) and the worker answers each on the record pipe \
(type 33). P4: a frame torn at the end of the pipe is a hang-up, any other \
malformed frame or an undecodable payload leaves the worker unable to be told \
anything, and it leaves as it would from a controller that is gone \
(kControlChannelBroken). P6: a tick that handled a message runs no slice; a \
paused worker beats with its progress unchanged and waits on the pipe; a duty \
cycle is busy for a share of its period and waits the rest; a Rebind or a \
Switch closes the runner (its records and tally sent), releases it in reverse \
order of construction, and prepares the next from the next unit index; if \
that is refused the old one is prepared again and the command is answered \
refused with the reason, and only if that also fails is it the worker's own \
failure (stage "restore"). The tally is cumulative across replacements, and a \
check that could not be made is stated once for the whole run, by the last \
runner, never as clean. T7: every message against real worker processes, \
N = 2 (tests/supervision/control_test.cpp)."""
