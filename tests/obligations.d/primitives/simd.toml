# Ledger fragment (ADR 0004): this file declares src/primitives/simd and nothing else.

[[module]]
path     = "src/primitives/simd"
classes  = ["P1", "P3"]
tiers    = ["T1"]
note     = """
The SIMD dispatch seam: today the contract header alone (ADR 0004). P1 is the \
path names and their parser, the set, the build's compiled paths and the \
kernel table's lookup, each arm tested in tests/contracts/simd/; P3 is the \
value outside the enumeration (in no set, named "unrecognised", no kernel) and \
a table without its scalar kernel, which kernel_paths() exposes. select_path() \
is declared and provided by the numerics stream, which takes this row over, \
adds its implementation's classes and tiers, and runs SelectPathContract \
against it; the suite's reference instantiation is in tests/contracts/simd/."""
