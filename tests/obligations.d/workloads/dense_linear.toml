# Ledger fragment (ADR 0004): this file declares src/workloads/dense_linear and nothing else.

[[module]]
path    = "src/workloads/dense_linear"
classes = ["P1", "P3"]
tiers   = ["T1"]
note    = """
Today the dense-linear specification alone (spec.hpp, ADR 0004): the entry \
generator at both ends of its range and its discarded low bits, the panel \
depths, the sizes, and gamma_n, each tested in tests/contracts/workloads/. \
The dense-linear stream takes this row over with the workload and owes what \
IMPLEMENTATION §3 lists for it -- P4 and P5, and T3, T4, T5, T5b, T6 -- with \
provides = ["WorkloadContract"]."""
