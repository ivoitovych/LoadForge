# Ledger fragment (ADR 0004): this file declares src/workloads/compression and nothing else.

[[module]]
path    = "src/workloads/compression"
classes = ["P1", "P3"]
tiers   = ["T1"]
note    = """
Today the compression specification alone (spec.hpp, ADR 0004): the LZ4 \
bound, the output header and its magic, each tested in \
tests/contracts/workloads/. The compression stream takes this row over with \
the workload and owes what IMPLEMENTATION §3 lists for it -- P4 and P5, and \
T3, T4, T5, T5b, T6 -- with provides = ["WorkloadContract"]."""
