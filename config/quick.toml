#
# The smallest run LoadForge accepts: one workload, for a short while, under
# no limits it does not already apply. The M1 controller runs the null
# workload with it; later milestones name real workloads here.

schema_version = 1

[run]
mode     = "stress"
# How long the workers run, counted from the moment the last of them has been
# started. Starting them is not part of it: on a slow or loaded machine a run
# takes that much longer than this, in all.
duration = "30s"

[[workload]]
name    = "null"
threads = "all"
